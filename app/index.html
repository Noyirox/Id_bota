<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Botany Offline Key</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Go Botany <span>Offline</span></h1>
            <nav>
                <button id="btn-full-key" class="active">Full Key</button>
                <button id="btn-d-key">Dichotomous Key</button>
                <button id="btn-search">Search</button>
            </nav>
            <div class="spm-filter">
                <label>
                    <input type="checkbox" id="spm-toggle">
                    <span class="star">★</span> SPM Species Only
                </label>
            </div>
        </div>
    </header>

    <main id="main-content">
        <!-- Browse View (formerly Full Key) -->
        <section id="view-full-key">
            <div class="layout-grid">
                <!-- Sidebar: Groups -->
                <aside class="sidebar">
                    <h2>Plant Groups</h2>
                    <div id="pile-groups" class="filter-section">
                        <div class="loader">Loading groups...</div>
                    </div>
                </aside>

                <!-- Main area: Results -->
                <div class="results-area">
                    <div class="results-header">
                        <h2 id="results-count">Matching Species (0)</h2>
                    </div>
                    <div id="species-grid" class="species-grid">
                        <!-- Species cards injected here -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Dichotomous Key View -->
        <section id="view-d-key" style="display: none;">
            <div class="dkey-container">
                <div class="dkey-header">
                    <h2 id="dkey-title">Dichotomous Key</h2>
                    <button id="btn-dkey-back" class="btn-secondary" style="display:none;">&larr; Back</button>
                </div>
                <div id="dkey-content" class="dkey-content">
                    <div class="loader">Loading dichotomous key...</div>
                </div>
            </div>
        </section>

        <!-- Search View -->
        <section id="view-search" style="display: none;">
            <div class="search-container">
                <h2>Search Database</h2>
                <input type="text" id="search-input" placeholder="Search by scientific or common name..." style="width: 100%; padding: 10px; font-size: 1.1rem; margin-bottom: 20px; box-sizing: border-box;">
                <div id="search-results" class="species-grid"></div>
            </div>
        </section>

        <!-- Rich Species Detail Modal -->
        <div id="species-modal" class="modal">
            <div class="modal-content rich-modal">
                <span class="close-btn">&times;</span>
                <div id="modal-body">
                    <div id="mini-carte" style="height: 300px; width: 100%; border-radius: 8px; background-color: #e0e0e0;"></div>
                    <!-- Dynamic content will go here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Data dependencies (these will be generated by the python script) -->
    <script src="db.js"></script>
    <script src="../data/observations.js"></script> <script src="app.js"></script>
</body>
</html>
